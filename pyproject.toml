[project]
name = "fastapi-essential"
version = "1.0.0"
description = "FastAPI Essential, Pre-Configured FastAPI Project with all essential dependencies and configurations for a robust and scalable FastAPI application."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# --- Dependencies Group ---
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.6",
    "logging>=0.4.9.6",
    "pydantic>=2.10.5",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.3.2",
    "sqlalchemy[asyncio]>=2.0.45",
]

# --- Dev Dependency Groups ---
[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.5.1",
    "ty>=0.0.15",
    "types-redis>=4.6.0.20241004",
]

# --- Ruff Configuration ---
[tool.ruff]
target-version = "py311"
exclude = [".venv", ".ruff_cache", "**/__pycache__", ".git", "alembic"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- Ty Configuration ---
[tool.ty]

# Environment
[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

# Source Configuration
[tool.ty.src]
include = ["src", "alembic/env.py"]
exclude = [".venv", ".ruff_cache", "**/__pycache__", ".git"]
respect-ignore-files = true

# Rules Configuration
[tool.ty.rules]
unresolved-import = "error"
invalid-method-override = "error"
call-non-callable = "error"
conflicting-declarations = "error"

# Terminal Output Configuration
[tool.ty.terminal]
output-format = "concise"
